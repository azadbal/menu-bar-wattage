name: MenuBarWattageApp
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
packages:
  PowerCore:
    path: ../Packages/PowerCore
targets:
  MenuBarWattageUI:
    type: framework
    platform: macOS
    sources:
      - path: Sources/MenuBarWattageUI
    dependencies:
      - package: PowerCore
        product: PowerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azadbalabanian.menubarwattage.ui
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2F328AJX43
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "13.0"

  MenuBarWattageApp:
    type: application
    platform: macOS
    productName: MenuBarWattage
    sources:
      - path: Sources/MenuBarWattageApp
    resources:
      - path: Resources/Assets.xcassets
    dependencies:
      - target: MenuBarWattageUI
      - package: PowerCore
        product: PowerCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Menu Bar Wattage
        LSApplicationCategoryType: public.app-category.utilities
    entitlements:
      path: Resources/MenuBarWattageApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azadbalabanian.menubarwattage
        PRODUCT_NAME: MenuBarWattage
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 2F328AJX43
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: 1.0.0
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - MenuBarWattageAppTests

  MenuBarWattageAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MenuBarWattageAppTests
    dependencies:
      - target: MenuBarWattageUI
      - package: PowerCore
        product: PowerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azadbalabanian.menubarwattage.tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
